<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超级Bunnies：寻找消失的NewJeans</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-DaeBKBhF.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-tEEmcP80.css">
</head>
<body>
  <div id="game-container">
    <div id="start-screen" class="screen active">
      <div class="title-container">
        <h1 class="game-title">超级Bunnies</h1>
        <h2 class="game-subtitle">寻找消失的NewJeans</h2>
        <div class="bunny-ears"></div>
      </div>
      <div class="start-btn" id="start-btn">开始游戏</div>
      <div class="world-select-btn" id="world-select-btn">关卡选择</div>
      <div class="game-info">
        <p>🎵 音乐律动系统 | 🌟 5大世界 | 🐰 可爱兔子主角</p>
      </div>
    </div>

    <div id="world-select-screen" class="screen">
      <h2 class="screen-title">选择关卡</h2>
      <div class="world-grid">
        <div class="world-card unlocked" data-world="1">
          <div class="world-icon">🌲</div>
          <h3>Attention 梦幻草坪</h3>
          <p>Minji 的世界</p>
        </div>
        <div class="world-card" data-world="2">
          <div class="world-icon">🌊</div>
          <h3>Hype Boy 海滩派对</h3>
          <p>Hanni 的世界</p>
        </div>
        <div class="world-card" data-world="3">
          <div class="world-icon">☁️</div>
          <h3>Ditto/OMG 迷雾学院</h3>
          <p>Danielle 的世界</p>
        </div>
        <div class="world-card" data-world="4">
          <div class="world-icon">⚡</div>
          <h3>Super Shy 闪耀广场</h3>
          <p>Haerin 的世界</p>
        </div>
        <div class="world-card" data-world="5">
          <div class="world-icon">🛸</div>
          <h3>How Sweet 赛博公路</h3>
          <p>Hyein 的世界</p>
        </div>
      </div>
      <button class="back-btn" id="back-btn">返回</button>
    </div>

    <div id="game-screen" class="screen">
      <div class="game-ui">
        <div class="score-display">
          <span class="label">音符</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="lives-display">
          <span class="label">生命</span>
          <span class="value" id="lives">3</span>
        </div>
        <div class="groove-display">
          <div class="groove-bar">
            <div class="groove-fill" id="groove-fill"></div>
          </div>
          <span class="groove-text" id="groove-text">Groove: 0%</span>
        </div>
      </div>
      <canvas id="game-canvas"></canvas>
      <div class="game-controls">
        <div class="control-btn" id="left-btn">←</div>
        <div class="control-btn" id="jump-btn">↑</div>
        <div class="control-btn" id="right-btn">→</div>
      </div>
    </div>

    <div id="pause-screen" class="screen">
      <h2>游戏暂停</h2>
      <button class="resume-btn" id="resume-btn">继续游戏</button>
      <button class="quit-btn" id="quit-btn">退出关卡</button>
    </div>

    <div id="game-over-screen" class="screen">
      <h2>游戏结束</h2>
      <p class="final-score">最终得分: <span id="final-score-value">0</span></p>
      <button class="restart-btn" id="restart-btn">重新开始</button>
      <button class="menu-btn" id="menu-btn">返回主菜单</button>
    </div>

    <div id="level-complete-screen" class="screen">
      <h2>关卡完成！</h2>
      <p class="level-score">得分: <span id="level-score-value">0</span></p>
      <p class="unlock-message" id="unlock-message"></p>
      <button class="next-level-btn" id="next-level-btn">下一关</button>
      <button class="menu-btn" id="menu-btn2">返回主菜单</button>
    </div>
  </div>

</body>
</html>
